[project]
name = "phone-record-summary"
version = "0.1.0"
description = "Automated phone call record analysis and summarization using Ollama Qwen3"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.3.0",
    "pathlib>=1.0.1",
    "python-dateutil>=2.8.2",
    "regex>=2023.10.3",
    "rich>=13.7.0",
    "loguru>=0.7.2",
    "pydantic>=2.5.0",
    "typer>=0.9.0",
    "jinja2>=3.1.2"
]

[project.scripts]
phone-summary = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0"
]
